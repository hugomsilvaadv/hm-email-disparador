{% extends 'base.html' %}
{% block title %}Entrar · HM{% endblock %}
{% block content %}
<div class="login-card card">
  <h1>Acesso administrativo</h1>
  <p class="muted">Painel de prospecção da HM Perícia & Cálculos.</p>
  <form method="post">
    <label>Usuário<input name="username" value="{{ admin_user }}" required autocomplete="username"></label>
    <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
